name: CI/CD para Vite

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build e Testes (CI)
    runs-on: ubuntu-latest

    steps: # Início dos passos do job 'build'
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependências
        run: npm install

      - name: Construir Projeto
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4
      
      - name: Upload do Artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' 

# ----------------------------------------------------
# Job de Deploy (CD) - Preste atenção à indentação aqui!
# ----------------------------------------------------
  deploy:
    name: Deploy para GitHub Pages (CD)
    environment: # Esta linha pertence ao job 'deploy'
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # Esta linha pertence ao job 'deploy', garantindo a ordem
    
    steps: # Início dos passos do job 'deploy'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4